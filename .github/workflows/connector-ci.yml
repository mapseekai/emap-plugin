name: emap Connector native CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/emap-connector/**'
      - 'repos/emap-postgis-plugin/**'
      - '.github/workflows/connector-ci.yml'
  pull_request:
    paths:
      - 'apps/emap-connector/**'
      - 'repos/emap-postgis-plugin/**'
      - '.github/workflows/connector-ci.yml'

permissions:
  contents: read

concurrency:
  group: connector-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            arch: x64
            bundles: nsis
          - name: macos-arm64
            runner: macos-15
            arch: arm64
            bundles: app,dmg
          - name: macos-x64
            runner: macos-15-intel
            arch: x64
            bundles: app,dmg
          - name: linux-x64
            runner: ubuntu-22.04
            arch: x64
            bundles: deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            repos/emap-postgis-plugin/package-lock.json
            apps/emap-connector/package-lock.json
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev patchelf libclang-dev clang
      - name: Locate libclang for native PostgreSQL parser (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvm\libclang.dll")) { throw "LLVM/libclang is required to build the PostgreSQL parser" }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and verify public PostGIS package
        working-directory: repos/emap-postgis-plugin
        run: npm ci && npm run verify
      - name: Verify connector native service and isolated runtime
        working-directory: apps/emap-connector
        run: npm ci && npm run verify && npm run prepare:native
      - name: Native Rust tests
        working-directory: apps/emap-connector
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native installer (unsigned CI artifact; no publishing)
        working-directory: apps/emap-connector
        env:
          CI: 'true'
        run: npm run build:native -- --ci --bundles '${{ matrix.bundles }}'
      - name: Enforce installer size below 10 MB
        working-directory: apps/emap-connector
        run: npm run package:size
      - uses: actions/upload-artifact@v4
        with:
          name: emap-connector-${{ matrix.name }}-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/emap-connector/src-tauri/target/release/bundle/nsis/*.exe
            apps/emap-connector/src-tauri/target/release/bundle/dmg/*.dmg
            apps/emap-connector/src-tauri/target/release/bundle/deb/*.deb

  browser-and-database:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Native service build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang pkg-config libssl-dev
      - working-directory: repos/emap-postgis-plugin
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - working-directory: apps/emap-connector
        run: npm ci && npm run verify && npm run test:integration && npm run test:options && npm run test:parity && npm run test:browser && npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-browser-database-results
          path: apps/emap-connector/test-results/
          retention-days: 14
